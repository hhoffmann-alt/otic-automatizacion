name: Ejecutar Análisis OTIC Diario

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ejecutar-colab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notificar ejecución
        run: |
          echo "🚀 ANÁLISIS OTIC PROGRAMADO"
          echo "Fecha: $(date)"
          echo "Notebook: https://colab.research.google.com/drive/1F9kP9IH89wewuDSAgCFdK8e1vArtttuj"
          echo "✓ El Colab se ejecutará automáticamente en tu entorno"
