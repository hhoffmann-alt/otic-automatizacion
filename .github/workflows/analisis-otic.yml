name: Ejecutar Análisis OTIC Diario

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ejecutar-colab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert papermill requests google-auth-oauthlib google-auth-httplib2 google-api-python-client google-colab

      - name: Ejecutar Colab OTIC
        env:
          COLAB_NOTEBOOK_ID: '1F9kP9IH89wewuDSAgCFdK8e1vArtttuj'
        run: |
          python execute_colab.py

      - name: Subir logs de ejecución
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: execution-logs
          path: |
            *.log
          retention-days: 30
